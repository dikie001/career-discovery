<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathfinder - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(to bottom, #0f172a, #0f172a);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, #14b8a6, #06b6d4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 20px 25px rgba(20, 184, 166, 0.2);
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #5eead4, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .tips {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-align: left;
      margin-bottom: 2rem;
    }

    .tips h2 {
      font-size: 0.875rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tips ul {
      list-style: none;
      space: 0.75rem;
    }

    .tips li {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      padding-left: 1.5rem;
      position: relative;
    }

    .tips li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #14b8a6;
      font-weight: bold;
    }

    .tips li.unavailable:before {
      content: "✗";
      color: #f87171;
    }

    .tips li.unavailable {
      opacity: 0.6;
      text-decoration: line-through;
    }

    .button {
      background: linear-gradient(to right, #14b8a6, #06b6d4);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 15px rgba(20, 184, 166, 0.3);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(20, 184, 166, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Some features may not be available right now.</p>

    <div class="tips">
      <h2>What you can still do:</h2>
      <ul>
        <li>View cached pages you've visited</li>
        <li>Check your profile information</li>
        <li>Read your previous conversations</li>
        <li class="unavailable">Chat with AI (requires internet)</li>
      </ul>
    </div>

    <button class="button" onclick="window.location.href='/'">Go to Home</button>
  </div>
</body>

</html>
